[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evorag"
version = "0.1.0"
description = "Resource-bounded retrieval-augmented generation foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1", "psutil>=6,<8", "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.13,<3", "types-psutil"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["evorag*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --cov=evorag --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv-phase01"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/evorag", "backend/tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
